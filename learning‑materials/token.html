<h1>4. Token（令牌）</h1>
<h2>个人理解</h2>
<p>Token就是AI看懂文字的最小碎片，一句话会被拆成一小段一小段交给模型计算。</p >
<h2>核心机制</h2>
<p>AI不会直接读汉字，而是把文字转换成一串数字编码，每一个编码就是一个token。</p >
<h2>真实应用场景</h2>
<p>聊天字数限制、计费收费、上下文最大长度全部都是用token数量计算。</p >
<h2>概念边界&容易混淆的点</h2>
<p>token ≠ 汉字，一个汉字可能等于1个token，长英文单词会拆成好几个token。</p >
<h2>参考来源</h2>
<p>OpenAI Token介绍文档</p >
<h3>自测问题</h3>
<p>1. Token是什么？</p >
<p>2. Token和文字数量是一一对应的吗？</p >
