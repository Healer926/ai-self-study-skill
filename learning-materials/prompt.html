<h1>3. Prompt（提示词）</h1>
<h2>个人理解</h2>
<p>Prompt就是我们发给AI的那句话，提问写得越清楚，AI回答效果越好。</p >
<h2>核心机制</h2>
<p>用户输入一段文字指令，大模型读取指令，按照描述的角色、格式、要求生成对应的回复。</p >
<h2>真实应用场景</h2>
<p>写文案、做表格、改写作文、生成PPT大纲、编写代码都需要精准的提示词。</p >
<h2>概念边界&容易混淆的点</h2>
<p>Prompt不等于简单问句，完整优质提示词一般包含角色、任务、格式、限制条件四部分。</p >
