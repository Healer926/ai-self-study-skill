<h1>2. 上下文(Context)</h1>
<h2>个人理解</h2>
<p>上下文就是对话全部历史记录，AI记住前面聊过的全部内容，才不会答非所问。</p >
<h2>核心机制</h2>
<p>每一轮提问都会带上完整对话文本，交给模型一起计算，保证回答连贯统一。</p >
<h2>真实应用场景</h2>
<p>写作文多次修改、连续问答聊天机器人、一步步写代码调试。</p >
<h2>概念边界&容易混淆的点</h2>
<p>上下文不是永久记忆，有长度上限，文字太多早期内容会被截断丢失。</p >
<h2>参考来源</h2>
<p>大语言模型官方文档</p >
<h3>自测问题</h3>
<p>1. 上下文起到什么作用？</p >
<p>2. 上下文过长会发生什么？</p >
