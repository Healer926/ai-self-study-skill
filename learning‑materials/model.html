<h1>5. Model（大语言模型）</h1>
<h2>个人理解</h2>
<p>大模型就是AI的大脑，经过海量文本数据训练，拥有理解文字、生成回答的能力。</p >
<h2>核心机制</h2>
<p>依靠神经网络学习人类语言规律，根据上文预测下一个最合适的文字，自动生成完整句子。</p >
<h2>真实应用场景</h2>
<p>对话聊天、文案创作、翻译、代码编写、图片生成全部依赖不同版本的大模型。</p >
<h2>概念边界&容易混淆的点</h2>
<p>模型本身不会真正“思考”，只是根据数据概率生成通顺合理的文字。</p >
